version: "3.9"

services:
  story-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stories_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"           # Offset from 5432 so it doesn't clash with other services
    volumes:
      - story_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stories_db"]
      interval: 5s
      retries: 5

  story-api:
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://user:pass@story-db:5432/stories_db
      AUTH_ENABLED: "false"          # Set to "true" + JWT_SECRET when Auth service is ready
      JWT_SECRET: "CHANGE_ME"
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AWS_ACCESS_KEY_ID: ""          # Fill in or mount from secrets
      AWS_SECRET_ACCESS_KEY: ""
      S3_BUCKET: talktrading-stories
      AWS_REGION: us-east-1
    depends_on:
      story-db:
        condition: service_healthy

  story-worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://user:pass@story-db:5432/stories_db
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      story-db:
        condition: service_healthy
    # In production, replace this container with a K8s CronJob

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI

volumes:
  story_pg_data:
