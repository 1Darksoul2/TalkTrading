services:
  explore-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talktrading-explore-service
    ports:
      - "${SERVER_PORT:-8083}:8083"
    environment:
      - SERVER_PORT=8083
      - POSTGRES_HOST=explore-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=explore_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=explore-redis
      - REDIS_PORT=6379
      - POST_SERVICE_URL=${POST_SERVICE_URL:-http://host.docker.internal:8000}
      - DEV_MODE=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      explore-postgres:
        condition: service_healthy
      explore-redis:
        condition: service_healthy
    networks:
      - explore-network
    restart: unless-stopped

  explore-postgres:
    image: postgres:16-alpine
    container_name: talktrading-explore-postgres
    environment:
      - POSTGRES_DB=explore_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - explore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d explore_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - explore-network
    restart: unless-stopped

  explore-redis:
    image: redis:7-alpine
    container_name: talktrading-explore-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - explore_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - explore-network
    restart: unless-stopped

  explore-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talktrading-explore-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_BACKEND_URL=http://explore-service:8083
    depends_on:
      - explore-service
    networks:
      - explore-network
    restart: unless-stopped

networks:
  explore-network:
    driver: bridge

volumes:
  explore_postgres_data:
  explore_redis_data:
