spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:talktrading_community;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.talktrading.community: DEBUG
    org.hibernate.SQL: DEBUG
