version: "3.9"

services:
  news-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5434:5432"          # Offset so it doesn't clash with other services
    volumes:
      - news_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d news_db"]
      interval: 5s
      retries: 5

  news-api:
    build: .
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://user:pass@news-db:5432/news_db
      # ── Provider selection ──────────────────────────────────────────────────
      # One of: newsapi | alphavantage | finnhub | polygon | gnews | mediastack
      NEWS_PROVIDER: newsapi
      NEWS_API_KEY: ""               # <-- Fill in your key here or mount as a secret
      NEWS_QUERY: "stock market OR crypto OR trading"
      NEWS_PAGE_SIZE: "50"
    depends_on:
      news-db:
        condition: service_healthy

  news-ingestion-worker:
    build: .
    command: python -m app.ingestion
    environment:
      DATABASE_URL: postgresql://user:pass@news-db:5432/news_db
      NEWS_PROVIDER: newsapi
      NEWS_API_KEY: ""               # <-- Fill in your key here
      NEWS_QUERY: "stock market OR crypto OR trading"
      NEWS_PAGE_SIZE: "50"
    depends_on:
      news-db:
        condition: service_healthy
    # In production, replace this with a K8s CronJob running every 10 minutes

volumes:
  news_pg_data:
