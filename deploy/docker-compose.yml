# TalkTrading production stack.
#   cd deploy && docker compose up -d --build
# Settings and secrets come from deploy/.env (create it with: python scripts/make_env.py).
# Only the gateway is reachable from outside; every other container is on the private network.

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

name: talktrading

services:
  gateway:
    <<: *common
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
      args:
        PUBLIC_URL: ${PUBLIC_URL}
        SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [post, story, news, chart, e2e, community, explore, reel]

  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  # ── Identity, posts, follows, notifications (unchanged code, configured here) ──
  post:
    <<: *common
    build: ../backend/post-service-feature-post-module
    environment:
      PORT: "8004"
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: post
      SECRET_KEY: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${LOGIN_LIFETIME_MINUTES:-10080}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      # Password reset links point here; mail goes out through SMTP_* when set (else the link is logged).
      PUBLIC_URL: ${PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-TalkTrading <no-reply@talktrading.app>}
    volumes:
      - post_uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }

  story:
    <<: *common
    build: ../backend/story-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/story
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      POST_SERVICE_URL: http://post:8004
      CORS_ORIGINS: ${PUBLIC_URL}
      MEDIA_DIR: /data/media
    volumes:
      - story_media:/data/media
    depends_on:
      db: { condition: service_healthy }

  news:
    <<: *common
    build: ../backend/news-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/news
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${PUBLIC_URL}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-finnhub}
      NEWS_API_KEY: ${NEWS_API_KEY}
    depends_on:
      db: { condition: service_healthy }

  chart:
    <<: *common
    build: ../backend/chart-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/chart
      CORS_ORIGINS_RAW: ${PUBLIC_URL}
    depends_on:
      db: { condition: service_healthy }

  reel:
    <<: *common
    build: ../backend/Reels-main
    # Rate limits are per client IP: read it from the gateway's X-Forwarded-For, or every user would share one limit.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/reel
      JWT_SECRET_KEY: ${JWT_SECRET}
      SERVICE_API_KEY: ${REEL_SERVICE_API_KEY}
      BACKEND_CORS_ORIGINS: '["${PUBLIC_URL}"]'
      MEDIA_DIR: /data/media
    volumes:
      - reel_media:/data/media
    depends_on:
      db: { condition: service_healthy }

  # ── Encrypted chat (unchanged code; Dockerfile copy in deploy/docker) ──
  e2e:
    <<: *common
    build:
      context: ../backend/E2E-main
      dockerfile: ../../deploy/docker/e2e.Dockerfile
    # Rate limits are per client IP: read it from the gateway's X-Forwarded-For, or every user would share one limit.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/e2e
      JWT_SECRET_KEY: ${JWT_SECRET}
      CORS_ORIGINS: ${PUBLIC_URL}
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # ── Java services (unchanged code). Identity comes only from the gateway. ──
  community:
    <<: *common
    build: ../backend/community-main
    mem_limit: 640m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/community
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DDL_AUTO: update
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      STORAGE_LOCAL_DIR: /app/uploads
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    volumes:
      - community_uploads:/app/uploads
    depends_on:
      db: { condition: service_healthy }

  explore:
    <<: *common
    build: ../backend/Explore-main
    mem_limit: 640m
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: explore
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      POST_SERVICE_URL: http://post:8004
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      DEV_MODE: "false"
      JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  post_uploads:
  story_media:
  community_uploads:
  reel_media:
